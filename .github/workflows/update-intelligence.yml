name: Refresh Knowledge Hub Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
      timezone: 'Asia/Tbilisi'

permissions:
  contents: write

concurrency:
  group: intelligence-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build public intelligence feed
        run: python backend/build_live_feed.py
      - name: Validate generated JSON
        run: python -m json.tool data/live.json > /dev/null
      - name: Commit feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh intelligence feed"
          git push
