<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><link rel="manifest" href="manifest.json"><title>Giga Knowledge Hub V4</title><style>body{margin:0;background:#070b12;color:#eef4ff;font:14px system-ui}.wrap{max-width:1200px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#8190a5}.hero{padding:55px 0 25px}.hero h1{font-size:40px;margin:6px 0}.scopes{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.scope,.card{border:1px solid #223044;background:#0d141e;border-radius:14px;padding:18px;cursor:pointer}.scope:hover,.card:hover{border-color:#20c7b7}.scope h3{margin:28px 0 5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card p,.scope p{font-size:11px;color:#8190a5;line-height:1.5}.pill{font-size:9px;border:1px solid #31504d;color:#76dfd2;border-radius:5px;padding:3px 6px}.btn{border:1px solid #2a394c;background:#101722;color:#c7d2e1;border-radius:9px;padding:8px 11px;cursor:pointer}.hidden{display:none}.detail{margin-top:18px;border:1px solid #223044;background:#0d141e;border-radius:14px;padding:18px}.tags{color:#8190a5;font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}@media(max-width:900px){.scopes{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.scopes{grid-template-columns:1fr}.wrap{padding:18px}.hero h1{font-size:32px}}</style></head><body><div class="wrap"><div class="top"><b>GIGA · KNOWLEDGE HUB</b><button class="btn" onclick="home()">Home</button></div><section id="home"><div class="hero"><div class="muted">PRIVATE INTELLIGENCE WORKSPACE · V4</div><h1>Knowledge, connected.</h1><p class="muted">Discover → Understand → Save → Connect → Act → Create</p></div><div class="scopes" id="scopes"></div></section><section id="view" class="hidden"><div class="hero"><div class="muted" id="sub"></div><h1 id="title"></h1></div><div class="grid" id="cards"></div><div class="detail hidden" id="detail"></div></section></div><script>let SEED,DB;const meta={projects:['Projects','Operational systems, automation and analytics','▦','#5B8CFF'],logistics:['Logistics','Ports, corridors, shipping and supply-chain intelligence','◉','#20C7B7'],football:['Football','Barcelona, Georgian legionnaires and European football','⚽','#63D68B'],knowledge:['Daily Knowledge','History, maritime knowledge and discovery','◈','#A78BFA'],content:['Content Studio','Research, fact-checking and publishing workflow','✦','#FF9F5A']};async function boot(){SEED=await fetch('seed.json').then(r=>r.json());DB=JSON.parse(localStorage.getItem('gkh-v4')||'null')||{objects:SEED.objects,edges:SEED.edges,sources:SEED.sources,favorites:[],notes:[],tasks:[],events:[],files:[]};save();renderHome();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}function save(){localStorage.setItem('gkh-v4',JSON.stringify(DB))}function renderHome(){scopes.innerHTML='';Object.entries(meta).forEach(([id,m])=>{let e=document.createElement('div');e.className='scope';e.style.borderTopColor=m[3];e.onclick=()=>openScope(id);e.innerHTML=`<div style="font-size:24px;color:${m[3]}">${m[2]}</div><h3>${m[0]}</h3><p>${m[1]}</p>`;scopes.appendChild(e)})}function home(){homeEl().classList.remove('hidden');view.classList.add('hidden');detail.classList.add('hidden')}function homeEl(){return document.getElementById('home')}function openScope(id){homeEl().classList.add('hidden');view.classList.remove('hidden');detail.classList.add('hidden');title.textContent=meta[id][0];sub.textContent=meta[id][1];let xs=DB.objects.filter(x=>x.scope===id);cards.innerHTML=xs.map(x=>`<div class="card" onclick="openDetail('${x.id}')"><span class="pill">${x.status}</span><h3>${x.title}</h3><p>${x.summary}</p><div class="tags">${x.tags.join(' · ')}</div></div>`).join('')}function openDetail(id){let x=DB.objects.find(o=>o.id===id);if(!x)return;detail.classList.remove('hidden');let fav=DB.favorites.includes(id);detail.innerHTML=`<span class="pill">${x.type} · ${x.status}</span><h2>${x.title}</h2><p class="muted">${x.summary}</p><h4>Connected areas</h4><p>${x.children.join(' · ')}</p><div class="actions"><button class="btn" onclick="toggleFav('${id}')">${fav?'★ Favorite':'☆ Favorite'}</button><button class="btn" onclick="addNote('${id}')">Add Note</button><button class="btn" onclick="sendContent('${id}')">Send to Content Studio</button></div>`;detail.scrollIntoView({behavior:'smooth',block:'nearest'})}function toggleFav(id){let i=DB.favorites.indexOf(id);i>=0?DB.favorites.splice(i,1):DB.favorites.push(id);save();openDetail(id)}function addNote(id){let t=prompt('Personal note');if(t){DB.notes.push({id:'n-'+Date.now(),objectId:id,text:t});save()}}function sendContent(id){let x=DB.objects.find(o=>o.id===id);DB.objects.push({id:'citem-'+Date.now(),scope:'content',title:x.title,type:'Content Item',status:'Idea',priority:x.priority,summary:'Created from '+x.title,tags:[...x.tags,'From Hub'],children:['Research','Fact Check','Draft']});save();alert('Sent to Content Studio')}boot()</script></body></html>
